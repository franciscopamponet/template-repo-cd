[project]
name = "esqueleto-ciencia-de-dados"
version = "0.1.0"
description = "Esqueleto canônico para projetos de Ciência de Dados do núcleo de dados da PoliJúnior"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "mlflow>=2.14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Extras opcionais: o núcleo instala sem eles. Ligados conforme o toggle/ambiente.
[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.29",
    "databricks-connect>=15.1",
]
spark = [
    "pyspark>=3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src-layout: o código do analista vive sob pipeline/, mas é importado por nome de
# primeiro nível (from common..., from models...). Declarar pipeline/common aqui faz
# o editable install colocar pipeline/ no sys.path, cobrindo também os namespace
# packages irmãos (models, data, entrypoints). Declaramos mais pacotes conforme surgem.
packages = ["pipeline/common"]

[tool.uv]
# Extras de plataforma nunca entram por padrão: o núcleo instala sozinho (Rule 06).
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["platform"]
# src-layout: o núcleo mora sob pipeline/ mas é importado por nome de primeiro nível
# (from common..., from models...). Isso ensina o isort do ruff a tratá-los como
# first-party, ordenando os imports corretamente.
src = ["pipeline", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["pipeline", "."]
